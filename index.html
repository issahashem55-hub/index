<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أبو الأكبر | مطور</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#ffd66b;--gold2:#ff9f43;--pink:#ff6fae;--violet:#8b5cf6;--cyan:#67e8f9;--bg:#080914;--card:rgba(20,20,39,.66)}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Cairo','Segoe UI',sans-serif}
body{min-height:100vh;overflow-x:hidden;color:#fff;background:radial-gradient(circle at 20% 10%,#3b1d4e 0,transparent 32%),radial-gradient(circle at 90% 20%,#123d58 0,transparent 28%),linear-gradient(135deg,#070815,#111126 55%,#1c1029);display:flex;align-items:center;justify-content:center;padding:100px 16px 36px;position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.04) 45%,transparent 70%);animation:shine 12s linear infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.aurora{position:fixed;inset:-20%;pointer-events:none;filter:blur(70px);opacity:.45;background:conic-gradient(from 90deg,#ff4d9d,#7c3aed,#22d3ee,#f59e0b,#ff4d9d);animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{to{transform:rotate(25deg) scale(1.2)}}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold);animation:float linear infinite;opacity:.65}@keyframes float{from{transform:translateY(110vh) translateX(0);opacity:0}15%{opacity:.7}to{transform:translateY(-15vh) translateX(var(--drift));opacity:0}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:18px 20px 14px;text-align:center;background:linear-gradient(180deg,rgba(5,6,17,.94),rgba(5,6,17,.45),transparent);backdrop-filter:blur(12px)}
.brand{font-size:clamp(23px,6vw,34px);font-weight:900;letter-spacing:.4px;background:linear-gradient(90deg,#fff,#ffd66b,#ff91c8,#fff);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brandGlow 7s linear infinite;text-shadow:0 0 30px rgba(255,190,100,.15)}
@keyframes brandGlow{to{background-position:250% center}}
.subtitle{margin-top:4px;font-size:11px;letter-spacing:3px;color:#c9c7dc}
.music-orbit{width:92px;height:92px;margin:18px auto 0;position:relative;display:grid;place-items:center}
.music-orbit:before,.music-orbit:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,214,107,.45);border-radius:50%;animation:orbit 10s linear infinite}.music-orbit:after{inset:9px;border-color:rgba(255,111,174,.5);animation-direction:reverse;animation-duration:7s}@keyframes orbit{to{transform:rotate(360deg)}}
.music-disc{width:58px;height:58px;border-radius:50%;background:conic-gradient(#ffd66b,#ff6fae,#8b5cf6,#67e8f9,#ffd66b);box-shadow:0 0 35px rgba(255,111,174,.55),inset 0 0 0 9px #17152c;display:grid;place-items:center;animation:disc 5s linear infinite}.music-disc:after{content:"♫";font-size:30px;color:#fff;text-shadow:0 0 14px #000}@keyframes disc{to{transform:rotate(360deg)}}
.scene{width:min(100%,430px);perspective:1200px;position:relative;z-index:5}.card{position:relative;padding:30px 24px 24px;border:1px solid rgba(255,255,255,.18);border-radius:32px;background:linear-gradient(145deg,rgba(35,30,65,.78),rgba(10,12,28,.7));backdrop-filter:blur(22px);box-shadow:0 35px 100px rgba(0,0,0,.55),0 0 70px rgba(139,92,246,.16),inset 0 1px rgba(255,255,255,.16);transform-style:preserve-3d;transition:transform .18s ease-out;overflow:hidden;animation:entry 1s cubic-bezier(.2,.8,.2,1)}.card:before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,transparent,#ffd66b55,transparent,#ff6fae44,transparent);transform:translateX(-100%);animation:borderSweep 8s ease-in-out infinite;pointer-events:none}@keyframes borderSweep{50%,100%{transform:translateX(100%)}}@keyframes entry{from{opacity:0;transform:translateY(50px) rotateX(18deg) scale(.92)}to{opacity:1;transform:none}}
.avatar{width:108px;height:108px;margin:0 auto 16px;border-radius:34px;display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;background:linear-gradient(145deg,#ff6fae,#8b5cf6 55%,#22d3ee);box-shadow:0 15px 45px #8b5cf655,inset 0 1px #ffffff88;transform:translateZ(55px) rotate(-5deg);animation:avatar 5s ease-in-out infinite}@keyframes avatar{50%{transform:translateZ(75px) rotate(5deg)}}
h1{text-align:center;font-size:30px;font-weight:900;letter-spacing:.2px;text-shadow:0 0 24px #ff9f4355;transform:translateZ(45px)}.role{text-align:center;color:#d7d4e7;font-size:13px;margin:7px 0 25px;transform:translateZ(35px)}
.info{position:relative;margin:12px 0;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px rgba(255,255,255,.05);text-align:right;transform:translateZ(25px);transition:.3s}.info:hover{transform:translateZ(45px) translateX(-4px);background:rgba(255,255,255,.09)}.info small{display:block;color:#aaa7c2;font-size:11px;margin-bottom:5px}.info strong{font-size:15px;color:#fff;overflow-wrap:anywhere}
.btn{width:100%;display:block;border:0;border-radius:18px;padding:15px;margin-top:13px;text-align:center;text-decoration:none;font-size:15px;font-weight:800;color:#fff;cursor:pointer;position:relative;overflow:hidden;transform:translateZ(35px);transition:.3s}.btn:hover{transform:translateZ(60px) scale(1.02)}.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-120%);transition:.6s}.btn:hover:before{transform:translateX(120%)}.telegram{background:linear-gradient(100deg,#8b5cf6,#ec4899,#f59e0b);box-shadow:0 12px 30px #8b5cf644}.copy{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.footer{text-align:center;color:#aaa7c2;font-size:11px;margin-top:18px;letter-spacing:1px}.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid rgba(255,255,255,.15);border-radius:50px;background:rgba(10,10,25,.78);backdrop-filter:blur(18px);box-shadow:0 10px 40px #0005}.controls button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}.controls button.playing{background:linear-gradient(135deg,#ff6fae,#8b5cf6);box-shadow:0 0 24px #ff6fae88}.volume{width:70px;accent-color:#ff9f43}.note{font-size:10px;color:#aaa7c2;white-space:nowrap}
@media(max-width:420px){body{padding-top:120px}.card{padding:25px 18px 20px}.brand{font-size:25px}.controls{bottom:10px}.note{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"></div><div class="particles" id="particles"></div>
<header class="topbar"><div class="brand">المطور أبو الأكبر</div><div class="subtitle">DIGITAL CREATOR • ANDROID & WEB</div><div class="music-orbit"><div class="music-disc"></div></div></header>
<main class="scene" id="scene"><section class="card" id="card">
<div class="avatar">أ</div><h1>أبو الأكبر</h1><p class="role">مطور تطبيقات ومواقع ويب</p>
<div class="info"><small>الاسم</small><strong>أبو الأكبر</strong></div>
<div class="info"><small>التخصص</small><strong>تطوير التطبيقات (Android & Web)</strong></div>
<div class="info"><small>حساب التيليجرام</small><strong>@hashem2008issa</strong></div>
<a class="btn telegram" href="https://t.me/hashem2008issa" target="_blank" rel="noopener">📱 تواصل معي على تيليجرام</a>
<button class="btn copy" id="copyBtn">📋 نسخ اسم المستخدم</button><div class="footer">صُنِعَ بإبداع • أبو الأكبر</div>
</section></main>
<div class="controls"><span class="note">الأغنية السورية التراثية</span><input class="volume" id="volume" type="range" min="0" max="100" value="65" aria-label="مستوى الصوت"><button id="musicBtn" aria-label="تشغيل أو إيقاف الموسيقى">🎵</button></div>
<audio id="audio" src="hashem.mp3" preload="auto" loop></audio>
<script>
const card=document.getElementById('card'),scene=document.getElementById('scene');
if(!matchMedia('(pointer:coarse)').matches){scene.addEventListener('pointermove',e=>{const r=scene.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateX(${-y*8}deg) rotateY(${x*9}deg)`});scene.addEventListener('pointerleave',()=>card.style.transform='')}
const particles=document.getElementById('particles');for(let i=0;i<34;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.setProperty('--drift',(Math.random()*160-80)+'px');p.style.animationDuration=(8+Math.random()*14)+'s';p.style.animationDelay=(-Math.random()*20)+'s';p.style.opacity=Math.random();particles.appendChild(p)}
const audio=document.getElementById('audio'),musicBtn=document.getElementById('musicBtn'),volume=document.getElementById('volume');audio.volume=.65;
function setPlaying(v){musicBtn.classList.toggle('playing',v);musicBtn.textContent=v?'🔊':'🎵'}
async function startMusic(){try{await audio.play();setPlaying(true)}catch(e){setPlaying(false)}}
musicBtn.addEventListener('click',()=>audio.paused?startMusic():(audio.pause(),setPlaying(false)));
volume.addEventListener('input',()=>audio.volume=Number(volume.value)/100);
['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(audio.paused)startMusic()},{once:true,passive:true}));
window.addEventListener('load',()=>startMusic());
document.getElementById('copyBtn').addEventListener('click',async()=>{const b=document.getElementById('copyBtn');try{await navigator.clipboard.writeText('hashem2008issa');b.textContent='✅ تم النسخ بنجاح';}catch(e){b.textContent='📋 hashem2008issa';}setTimeout(()=>b.textContent='📋 نسخ اسم المستخدم',2000)});
</script>
</body></html>
